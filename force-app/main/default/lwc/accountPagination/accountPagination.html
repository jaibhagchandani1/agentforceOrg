<template>
    <lightning-card title="Accounts" icon-name="standard:account">
        <div class="slds-var-m-around_medium">
            <template if:true={accounts}>
                <lightning-datatable
                    key-field="Id"
                    data={accounts}
                    columns={columns}
                    hide-checkbox-column="true"
                >
                </lightning-datatable>
            </template>
            <template if:true={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>
        </div>
        <div class="slds-var-m-around_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div>
                Total Records: {totalRecords} | Page {pageNumber} of {totalPages}
            </div>
            <div>
                <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrevious} disabled={isFirstPage} class="slds-var-m-right_x-small"></lightning-button>
                <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={handleNext} disabled={isLastPage}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
